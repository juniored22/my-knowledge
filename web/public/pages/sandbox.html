<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MIDaS com Webcam</title>

  <!-- TensorFlow.js peer dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation"></script>
  <!-- Modelo de estimativa de profundidade -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/depth-estimation"></script>

  <style>
    canvas, video {
      display: block;
      margin: 10px auto;
      max-width: 100%;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted width="640" height="480"></video>
<canvas id="depthCanvas" width="640" height="480"></canvas>

<script>
(async function () {
  const video = document.getElementById('video');
  video.style.transform = 'scaleX(-1)';
  
  const canvas = document.getElementById('depthCanvas');
  const ctx = canvas.getContext('2d');

  const modelType = depthEstimation.SupportedModels.ARPortraitDepth;
  const estimatorConfig = { minDepth: 0, maxDepth: 1 };
  const estimator = await depthEstimation.createEstimator(modelType, estimatorConfig);

  const stream = await navigator.mediaDevices.getUserMedia({ video: {
    facingMode: (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) ? 'environment' : 'user',
  }});
  video.srcObject = stream;
  video.addEventListener('loadeddata', estimateDepth);

  async function estimateDepth() {

    const depthMap = await estimator.estimateDepth(video, {
      flipHorizontal: true,
      inputResolution: { width: 256, height: 256 },
      minDepth: 0.001,
      maxDepth: 10,
    });

    const depthTensor = depthMap.depthTensor;
    const minVal = (await tf.min(depthTensor).data())[0];
    const maxVal = (await tf.max(depthTensor).data())[0];
    const minTensor = tf.scalar(minVal);
    const rangeTensor = tf.scalar(maxVal - minVal);

    console.log({depthMap, depthTensor, rangeTensor});

    const normalized = depthTensor.sub(minTensor)
    .div(rangeTensor)
    .mul(255)
    .toInt();

    const [height, width] = normalized.shape;
    const imageData = new ImageData(width, height);
    const data = await normalized.data();

    for (let i = 0; i < data.length; i++) {
      const val = data[i];
      imageData.data[i * 4 + 0] = val;         // Red
      imageData.data[i * 4 + 1] = 10;           // Green
      imageData.data[i * 4 + 2] = 255 - val;   // Blue
      imageData.data[i * 4 + 3] = 255;         // Alpha
    }

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);
    ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);

    normalized.dispose();
    depthTensor.dispose();

    requestAnimationFrame(estimateDepth);
  }

  
})();
</script>

</body>
</html>
