<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jogo em Primeira Pessoa</title>
  <style>
    body { margin: 0; overflow: hidden; padding: 0; }
    canvas { display: block; }
    #instructions {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1;
      cursor: pointer;
    }
    button {
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      border: none;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 2rem;
      padding: 10px;
      border-radius: 10px;
      touch-action: none;
    }
    .infoSystem{
      position: absolute;
    }
    video {
      transform: scaleX(-1);
      /* visibility: hidden; */
    }

  </style>
</head>
<body>
  <div id="instructions">Clique para começar</div>
  <span class="infoSystem">teste</span>

  <div id="mobile-controls" style="position: fixed; bottom: 20px; left: 20px; z-index: 10;">
    <button id="move-forward">↑</button>
    <button id="move-backward">↓</button>
  </div>
  

  <div>
    <video id="webcam" autoplay muted playsinline style="position: absolute; top: 0; left: 0; z-index: 0;"></video>
    <!-- <canvas id="overlay" style="position: absolute; top: 0; left: 0; z-index: 1;border: 1px solid red;"></canvas> -->
    <canvas id="overlay" style="position: absolute; top: 0; left: 0; z-index: 1;border: 1px solid red;"></canvas>
  </div>
  <script type="module" src="/static/modules/Game.mjs?v=2"></script>
</body>
</html>
