<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Benchmark Three.js PESADO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      background: #000;
      color: #0f0;
    }
    #stats {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      font-size: 14px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="stats">Carregando...</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const statsEl = document.getElementById("stats");

    // Cena, câmera e renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.z = 150;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    const light = new THREE.PointLight(0xffffff, 1, 0);
    light.position.set(50, 50, 50);
    scene.add(light);

    // Criação em massa de objetos
    const count = 10000; // quanto maior, mais pesado
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

    const cubes = [];
    for (let i = 0; i < count; i++) {
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(
        (Math.random() - 0.5) * 300,
        (Math.random() - 0.5) * 300,
        (Math.random() - 0.5) * 300
      );
      cube.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      cubes.push(cube);
      scene.add(cube);
    }

    // FPS e tempo de render
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 0;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = now - lastTime;
      frameCount++;

      if (delta >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      // anima todos os cubos
      for (let i = 0; i < cubes.length; i++) {
        cubes[i].rotation.y += 0.01;
        cubes[i].rotation.x += 0.005;
      }

      const startRender = performance.now();
      renderer.render(scene, camera);
      const endRender = performance.now();

      statsEl.innerHTML = `
        🧠 Objetos: ${count}<br>
        🎮 FPS: ${fps}<br>
        ⏱️ Render: ${(endRender - startRender).toFixed(2)} ms
      `;
    }

    animate();
  </script>
</body>
</html>
